name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.example --project-name garment_ledger app_build

      - name: Copy app files
        run: |
          cp main.dart app_build/lib/main.dart
          cp pubspec.yaml app_build/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="အထည်ချုပ်စာရင်း"/' app_build/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app_build
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: garment-ledger-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK v${{ github.run_number }}
          files: app_build/build/app/outputs/flutter-apk/app-release.apk
