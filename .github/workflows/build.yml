name: Build offline site + APK

# Runs whenever you change src/index.html (or press "Run workflow" in the Actions tab).
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.mjs', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1) make a self-contained index.html (all libraries + font inside)
      - name: Build offline index.html
        run: node build.mjs

      # 2) keep the SAME signing key forever, otherwise Android refuses to install an APK as an update.
      #    Created once on the first run, then committed to the repo and re-used.
      - name: Signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=BonusBook,O=BonusBook,C=MM"
          fi
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      # 3) wrap www/ into an Android app (Capacitor)
      - name: Create Android project
        run: |
          rm -f package.json package-lock.json capacitor.config.json   # old leftovers from the previous setup
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kohtet.bonusbook",
            "appName": "Bonus Book",
            "webDir": "www",
            "backgroundColor": "#000000",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          # camera for the "Scan QR" button
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # every build gets a bigger version number so it installs over the old one
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect files
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BonusBook.apk

      # 4) publish: APK as a GitHub Release, offline index.html to the site root (GitHub Pages)
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bonus Book v${{ github.run_number }}
          files: BonusBook.apk

      - name: Commit site + key
        run: |
          cp www/index.html index.html
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html debug.keystore
          git diff --cached --quiet || git commit -m "Build offline index.html (v${GITHUB_RUN_NUMBER}) [skip ci]"
          git push
